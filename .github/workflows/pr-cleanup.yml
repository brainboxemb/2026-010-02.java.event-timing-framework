name: Cleanup PR build preview

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose generated build preview should be removed
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Generated-output branch lifecycle is generic Git/repository behaviour. Keep
  # product Java/release semantics out of this cleanup caller.
  cleanup:
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-pr-preview-cleanup.yml@v0.2.2
    with:
      preview_suffixes: bld
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}

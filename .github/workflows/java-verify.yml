name: Java verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-failed'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      app_jar: ${{ steps.metadata.outputs.app_jar }}
      framework_jar: ${{ steps.metadata.outputs.framework_jar }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Validate Maven version, CHANGELOG and tag semantics
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_metadata.py inspect \
            --git-ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Verify failed-tag archival semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_archive_failed_release_tag.py

  bootstrap-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: Bootstrap local tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "5db2b23b95ad0a230ab5d5d2bed725927328fcfe"
          test "$(git -C tools/tool.java-project rev-parse HEAD)" = "3dd4b176956513948c601ec9cf95f09f6f21712a"
      - name: Verify logging dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<artifactId>slf4j-api</artifactId>' framework/pom.xml
          ! grep -F '<artifactId>slf4j-jdk14</artifactId>' framework/pom.xml
          grep -F '<artifactId>slf4j-jdk14</artifactId>' app/pom.xml

  bootstrap-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { git status --short; throw "Checkout is not clean." }
      - name: Bootstrap local tooling
        shell: pwsh
        run: |
          .\bootstrap.ps1
          if ((git -C tools/tool.git-project rev-parse HEAD).Trim() -ne "5db2b23b95ad0a230ab5d5d2bed725927328fcfe") { throw "Unexpected tool.git-project SHA" }
          if ((git -C tools/tool.java-project rev-parse HEAD).Trim() -ne "3dd4b176956513948c601ec9cf95f09f6f21712a") { throw "Unexpected tool.java-project SHA" }

  java:
    needs:
      - release-metadata
      - bootstrap-linux
      - bootstrap-windows
    permissions:
      contents: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-verify.yml@3dd4b176956513948c601ec9cf95f09f6f21712a
    with:
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-framework-canonical
      artifact-path: app/target/${{ needs.release-metadata.outputs.app_jar }}
      runnable-jar-name: ${{ needs.release-metadata.outputs.app_jar }}
      smoke-expected-output: 'event-timing-app lifecycle OK version=${{ needs.release-metadata.outputs.version }} state=STOPPED'
      test-report-path: '**/target/surefire-reports/**'
      publication-artifact-paths: |
        framework/target/${{ needs.release-metadata.outputs.framework_jar }}
        app/target/${{ needs.release-metadata.outputs.app_jar }}

  publish-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: java
    permissions:
      contents: write
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@3dd4b176956513948c601ec9cf95f09f6f21712a
    with:
      publication-artifact-name: event-timing-framework-canonical-publication

  create-release-tag:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - java
      - publish-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create immutable release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tagged_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "ERROR: ${RELEASE_TAG} already points to ${tagged_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already identifies this verified commit."
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Verify the exact tag in a fresh workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN tag pushes do not recursively start workflows. workflow_dispatch
          # is an explicit exception, so dispatch the same verification workflow at the tag.
          gh workflow run java-verify.yml --ref "${RELEASE_TAG}"
          echo "Dispatched Java verification for ${RELEASE_TAG}."

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - java
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download canonical release publication
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-timing-framework-canonical-publication
          path: publication
      - name: Verify release artifact identity and prepare assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          FRAMEWORK_JAR: ${{ needs.release-metadata.outputs.framework_jar }}
        run: |
          set -euo pipefail
          test "$(cat publication/source-sha.txt)" = "${GITHUB_SHA}"
          test -f "publication/artifacts/${APP_JAR}"
          test -f "publication/artifacts/${FRAMEWORK_JAR}"

          python3 tools/release_metadata.py verify-artifact \
            --jar "publication/artifacts/${APP_JAR}" \
            --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}"
          python3 tools/release_metadata.py release-notes \
            --version "${RELEASE_VERSION}" \
            --output release-notes.md

          (cd publication/artifacts && sha256sum "${APP_JAR}" "${FRAMEWORK_JAR}") \
            > "SHA256SUMS-${RELEASE_VERSION}.txt"
          tar -czf "event-timing-release-evidence-${RELEASE_VERSION}.tar.gz" \
            -C publication README.md source-sha.txt evidence
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          FRAMEWORK_JAR: ${{ needs.release-metadata.outputs.framework_jar }}
        run: |
          set -euo pipefail
          assets=(
            "publication/artifacts/${FRAMEWORK_JAR}"
            "publication/artifacts/${APP_JAR}"
            "SHA256SUMS-${RELEASE_VERSION}.txt"
            "event-timing-release-evidence-${RELEASE_VERSION}.tar.gz"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi

  archive-failed-release:
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      (
        needs.release-metadata.result != 'success' ||
        needs.bootstrap-linux.result != 'success' ||
        needs.bootstrap-windows.result != 'success' ||
        needs.java.result != 'success' ||
        needs.publish-release.result != 'success'
      )
    needs:
      - release-metadata
      - bootstrap-linux
      - bootstrap-windows
      - java
      - publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout failed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Remove any incomplete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
      - name: Preserve candidate as failed tag and remove normal release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/archive_failed_release_tag.py \
            --remote origin \
            --tag "${RELEASE_TAG}" \
            --expected-revision "${GITHUB_SHA}"

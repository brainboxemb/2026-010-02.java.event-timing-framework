name: Java verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-failed'
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact comparison base commit for manual non-tag qualification
        required: false
        type: string
      windows_mode:
        description: Windows qualification override for a manual non-tag run
        required: false
        type: choice
        default: full
        options:
          - full
          - auto
          - smoke
          - none

permissions:
  contents: read

jobs:
  # Product-owned metadata and dependency-boundary checks remain local. They are
  # intentionally cheap and do not allocate a JDK, Maven or Windows runner.
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      app_jar: ${{ steps.metadata.outputs.app_jar }}
      core_jar: ${{ steps.metadata.outputs.core_jar }}
      timing_data_jar: ${{ steps.metadata.outputs.timing_data_jar }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Maven version, CHANGELOG and tag semantics
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_metadata.py inspect \
            --git-ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify failed-tag archival semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_archive_failed_release_tag.py

      - name: Verify logging dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<artifactId>slf4j-api</artifactId>' core/pom.xml
          ! grep -F '<artifactId>slf4j-jdk14</artifactId>' core/pom.xml
          grep -F '<artifactId>slf4j-jdk14</artifactId>' app/pom.xml

      - name: Verify black-box system-test dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f system-test/pom.xml
          ! grep -F '<artifactId>event-timing-data</artifactId>' system-test/pom.xml
          ! grep -F '<artifactId>event-timing-core</artifactId>' system-test/pom.xml
          ! grep -F '<artifactId>event-timing-app</artifactId>' system-test/pom.xml

  # Normal development lifecycle. Pull requests use affected auto-selection;
  # protected main publication deliberately does not allocate Windows again.
  java-production:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: release-metadata
    permissions:
      contents: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-production.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      base-revision: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_revision }}
      head-revision: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      affected-task: core:java.canonical
      windows-full-task: core:java.windows-full
      windows-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_mode || github.event_name == 'push' && 'none' || 'auto' }}
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-core-canonical
      artifact-path: app/target/${{ needs.release-metadata.outputs.app_jar }}
      runnable-jar-name: ${{ needs.release-metadata.outputs.app_jar }}
      smoke-expected-output: 'event-timing-app lifecycle OK version=${{ needs.release-metadata.outputs.version }} state=STOPPED'
      test-report-path: '**/target/surefire-reports/**'
      publication-artifact-paths: |
        shared/timing-data/target/${{ needs.release-metadata.outputs.timing_data_jar }}
        core/target/${{ needs.release-metadata.outputs.core_jar }}
        app/target/${{ needs.release-metadata.outputs.app_jar }}

  main-system-test:
    name: Main black-box system verification
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.java-production.outputs.affected == 'true'
    needs:
      - java-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact integrated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven

      - name: Run VC-ST1 black-box system verification
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify -Psystem-test

      - name: Upload main system-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-timing-system-test-main-evidence
          path: |
            system-test/target/surefire-reports/**
            system-test/target/evidence/**
          if-no-files-found: warn
          retention-days: 14

  publish-build:
    if: >-
      needs.java-production.outputs.affected == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: java-production
    permissions:
      contents: write
      actions: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      publication-artifact-name: event-timing-core-canonical-publication
      preflight-artifact-name: event-timing-core-canonical-preflight
      source-revision: ${{ github.event.pull_request.head.sha || github.sha }}

  publish-main-system-test-evidence:
    name: Publish main black-box evidence
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.java-production.outputs.affected == 'true'
    needs:
      - java-production
      - main-system-test
      - publish-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout current generated production build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: prod/bld
          path: publication
          fetch-depth: 1

      - name: Download main system-test evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-timing-system-test-main-evidence
          path: system-test-evidence

      - name: Stage black-box evidence in the central build tree
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          published_revision="$(tr -d '\r\n' < publication/source-sha.txt)"
          if [[ "$published_revision" != "$GITHUB_SHA" ]]; then
            echo "prod/bld already points to $published_revision; current run is $GITHUB_SHA."
            echo "A newer generated build has superseded this run; no evidence will be written."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -d system-test-evidence/evidence
          test -d system-test-evidence/surefire-reports

          target="publication/evidence/tests/system-test"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a system-test-evidence/evidence/. "$target/"
          cp -a system-test-evidence/surefire-reports "$target/surefire-reports"

          grep -Fxq 'PASS' "$target/VC-ST1-001/result.txt"
          grep -Fxq 'PASS' "$target/VC-ST1-002/result.txt"
          test -s "$target/VC-ST1-002/timing-data.jsonl"

          cat > "$target/README.md" <<EOF
          # Separate-process system verification

          Retained evidence from the VC-ST1 black-box verification of source revision
          \`$GITHUB_SHA\`.

          - **VC-ST1-001:** PASS — executable/API/reconnect/control-shutdown baseline.
          - **VC-ST1-002:** PASS — first committed registration, WebSocket reconnect and persisted LogBook recovery across a full SI-01 restart; recovered history is not emitted as a new live commit.
          - \`VC-ST1-002/timing-data.jsonl\` is the actual persistence file written by SI-01 during the test.
          - \`surefire-reports/\` contains the JUnit reports for both separate-process tests.

          Each VC directory also retains the generated application configuration,
          captured SI-01 process output and the explicit PASS/FAIL result.
          EOF

          python3 - <<'PY'
          from pathlib import Path

          tests_readme = Path("publication/evidence/tests/README.md")
          text = tests_readme.read_text(encoding="utf-8").rstrip()
          marker = "## Separate-process system verification"
          if marker in text:
              text = text.split(marker, 1)[0].rstrip()
          text += (
              "\n\n## Separate-process system verification\n\n"
              "The canonical Maven summary above covers the ordinary module tests. "
              "The separately executed process-level VC-ST1 verification is retained "
              "under [system-test/](system-test/README.md), including the real "
              "TimingData persistence file produced by VC-ST1-002.\n"
          )
          tests_readme.write_text(text, encoding="utf-8")

          root_readme = Path("publication/README.md")
          root = root_readme.read_text(encoding="utf-8")
          link = (
              "- [Separate-process system verification]"
              "(evidence/tests/system-test/README.md) — VC-ST1 black-box results, "
              "runtime output and persisted TimingData evidence.\n"
          )
          if link not in root:
              needle = (
                  "- [Readable Surefire summary](evidence/tests/README.md) — "
                  "aggregate test result with retained raw Surefire reports below "
                  "`evidence/tests/`.\n"
              )
              if needle not in root:
                  raise SystemExit("generated README does not contain the expected test summary link")
              root = root.replace(needle, needle + link)
          root_readme.write_text(root, encoding="utf-8")
          PY

      - name: Publish supplemented production evidence
        if: ${{ steps.stage.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C publication config user.name "github-actions[bot]"
          git -C publication config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publication add README.md evidence/tests

          if git -C publication diff --cached --quiet; then
            echo "Central build evidence already contains this system-test result."
            exit 0
          fi

          git -C publication commit -m "Publish system-test evidence for ${GITHUB_SHA:0:12}"
          git -C publication push origin HEAD:prod/bld

  # Product release semantics remain repository-owned. A reviewed non-SNAPSHOT
  # main commit is tagged only after the normal Linux/publication path succeeds.
  # The tag is then independently dispatched below for full Windows qualification.
  create-release-tag:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - java-production
      - main-system-test
      - publish-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tagged_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "ERROR: ${RELEASE_TAG} already points to ${tagged_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already identifies this verified commit."
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Verify the exact tag in a fresh workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run java-verify.yml --ref "${RELEASE_TAG}"
          echo "Dispatched Java verification for ${RELEASE_TAG}."

  # Exact release-tag producer. Linux and native Windows Maven qualification can
  # start in parallel; only the exact Linux-produced application smoke waits for
  # the canonical Linux artifact.
  release-linux:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs: release-metadata
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-verify.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      source-revision: ${{ github.sha }}
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-core-canonical
      artifact-path: app/target/${{ needs.release-metadata.outputs.app_jar }}
      runnable-jar-name: ''
      smoke-expected-output: ''
      test-report-path: '**/target/surefire-reports/**'
      publication-artifact-paths: |
        shared/timing-data/target/${{ needs.release-metadata.outputs.timing_data_jar }}
        core/target/${{ needs.release-metadata.outputs.core_jar }}
        app/target/${{ needs.release-metadata.outputs.app_jar }}
      windows-mode: none

  release-windows-full:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs: release-metadata
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-windows-compatibility.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      source-revision: ${{ github.sha }}
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-core-canonical
      runnable-jar-name: ''
      smoke-expected-output: ''
      test-report-path: '**/target/surefire-reports/**'
      windows-mode: full

  release-windows-smoke:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - release-linux
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-windows-compatibility.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      source-revision: ${{ github.sha }}
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-core-canonical
      runnable-jar-name: ${{ needs.release-metadata.outputs.app_jar }}
      smoke-expected-output: 'event-timing-app lifecycle OK version=${{ needs.release-metadata.outputs.version }} state=STOPPED'
      test-report-path: '**/target/surefire-reports/**'
      windows-mode: smoke

  release-system-test-linux:
    name: Release black-box system verification (Linux)
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven

      - name: Run VC-ST1 black-box system verification
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify -Psystem-test

      - name: Upload Linux system-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-timing-system-test-release-linux-evidence
          path: |
            system-test/target/surefire-reports/**
            system-test/target/evidence/**
          if-no-files-found: warn
          retention-days: 14

  release-system-test-windows:
    name: Release black-box system verification (Windows)
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs: release-metadata
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven

      - name: Run VC-ST1 black-box system verification
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify -Psystem-test

      - name: Upload Windows system-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-timing-system-test-release-windows-evidence
          path: |
            system-test/target/surefire-reports/**
            system-test/target/evidence/**
          if-no-files-found: warn
          retention-days: 14

  release-publish-build:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - release-linux
      - release-windows-full
      - release-windows-smoke
      - release-system-test-linux
      - release-system-test-windows
    permissions:
      contents: write
      actions: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@c0ca2e1365a64bc626ca331a8170d13340ae0b36
    with:
      publication-artifact-name: event-timing-core-canonical-publication
      source-revision: ${{ github.sha }}

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - release-linux
      - release-windows-full
      - release-windows-smoke
      - release-system-test-linux
      - release-system-test-windows
      - release-publish-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout finalized release publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: rel/${{ needs.release-metadata.outputs.release_tag }}/bld
          path: publication
          fetch-depth: 1
          persist-credentials: false

      - name: Download Linux system-test evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-timing-system-test-release-linux-evidence
          path: system-test-evidence/linux

      - name: Download Windows system-test evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-timing-system-test-release-windows-evidence
          path: system-test-evidence/windows

      - name: Verify release artifact identity and prepare assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          CORE_JAR: ${{ needs.release-metadata.outputs.core_jar }}
          TIMING_DATA_JAR: ${{ needs.release-metadata.outputs.timing_data_jar }}
        run: |
          set -euo pipefail
          test "$(cat publication/source-sha.txt)" = "${GITHUB_SHA}"
          test -f "publication/artifacts/${APP_JAR}"
          test -f "publication/artifacts/${CORE_JAR}"
          test -f "publication/artifacts/${TIMING_DATA_JAR}"

          python3 tools/release_metadata.py verify-artifact \
            --jar "publication/artifacts/${APP_JAR}" \
            --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}"
          python3 tools/release_metadata.py release-notes \
            --version "${RELEASE_VERSION}" \
            --output release-notes.md

          (cd publication/artifacts && sha256sum "${TIMING_DATA_JAR}" "${CORE_JAR}" "${APP_JAR}") \
            > "SHA256SUMS-${RELEASE_VERSION}.txt"

          mkdir -p publication/evidence/system-test/linux publication/evidence/system-test/windows
          cp -R system-test-evidence/linux/. publication/evidence/system-test/linux/
          cp -R system-test-evidence/windows/. publication/evidence/system-test/windows/

          tar -czf "event-timing-release-evidence-${RELEASE_VERSION}.tar.gz" \
            -C publication README.md source-sha.txt evidence orchestration

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          CORE_JAR: ${{ needs.release-metadata.outputs.core_jar }}
          TIMING_DATA_JAR: ${{ needs.release-metadata.outputs.timing_data_jar }}
        run: |
          set -euo pipefail
          assets=(
            "publication/artifacts/${TIMING_DATA_JAR}"
            "publication/artifacts/${CORE_JAR}"
            "publication/artifacts/${APP_JAR}"
            "SHA256SUMS-${RELEASE_VERSION}.txt"
            "event-timing-release-evidence-${RELEASE_VERSION}.tar.gz"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi

  archive-failed-release:
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      (
        needs.release-metadata.result != 'success' ||
        needs.release-linux.result != 'success' ||
        needs.release-windows-full.result != 'success' ||
        needs.release-windows-smoke.result != 'success' ||
        needs.release-system-test-linux.result != 'success' ||
        needs.release-system-test-windows.result != 'success' ||
        needs.release-publish-build.result != 'success' ||
        needs.publish-release.result != 'success'
      )
    needs:
      - release-metadata
      - release-linux
      - release-windows-full
      - release-windows-smoke
      - release-system-test-linux
      - release-system-test-windows
      - release-publish-build
      - publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout failed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Remove any incomplete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

      - name: Preserve candidate as failed tag and remove normal release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/archive_failed_release_tag.py \
            --remote origin \
            --tag "${RELEASE_TAG}" \
            --expected-revision "${GITHUB_SHA}"

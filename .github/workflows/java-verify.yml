name: Java verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-failed'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Product-owned metadata stays outside the generic Java/Moon tooling. It is the
  # authoritative source for the current Maven version and versioned JAR names.
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      app_jar: ${{ steps.metadata.outputs.app_jar }}
      framework_jar: ${{ steps.metadata.outputs.framework_jar }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Validate Maven version, CHANGELOG and tag semantics
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_metadata.py inspect \
            --git-ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Verify failed-tag archival semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_archive_failed_release_tag.py

  # Native Windows bootstrap is kept as a small repository-contract check. The
  # actual compatibility Maven build is owned by tool.java-project below.
  bootstrap-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { git status --short; throw "Checkout is not clean." }
      - name: Bootstrap released tooling
        shell: pwsh
        run: |
          .\bootstrap.ps1
          if ((git -C tools/tool.git-project rev-parse HEAD).Trim() -ne "d6d760845967f70bd266b3ac2b36c9d5b0edc862") { throw "Unexpected tool.git-project SHA" }
          if ((git -C tools/tool.java-project rev-parse HEAD).Trim() -ne "d0905548502577ff0a6726eadd73cd214c2bc2c9") { throw "Unexpected tool.java-project SHA" }
          if (-not (Select-String -Path project.yml -SimpleMatch 'ref: v0.1.4')) { throw "Semantic Java tooling release ref is missing." }
          .\tools\tool.git-project\git-project.ps1 validate -RepoRoot .

  # Moon owns high-level execution/cache decisions. tool.java-project still owns
  # the one canonical Maven lifecycle and all Java producer evidence.
  linux-canonical:
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision with Moon VCS history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Bootstrap released tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "d6d760845967f70bd266b3ac2b36c9d5b0edc862"
          test "$(git -C tools/tool.java-project rev-parse HEAD)" = "d0905548502577ff0a6726eadd73cd214c2bc2c9"
          grep -F 'ref: v0.1.4' project.yml
          tools/tool.git-project/git-project.sh validate --repo .

      - name: Verify logging dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<artifactId>slf4j-api</artifactId>' framework/pom.xml
          ! grep -F '<artifactId>slf4j-jdk14</artifactId>' framework/pom.xml
          grep -F '<artifactId>slf4j-jdk14</artifactId>' app/pom.xml

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Run or hydrate canonical Java task
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: brainboxemb/tool.git-project/moon@v0.2.2
        with:
          task: framework:java.canonical
          cache-namespace: event-timing-framework-java-canonical

      - name: Build exact release tag producer
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          # Release assets must be produced by the exact tagged commit. Do not
          # accept an equivalent earlier producer from the portable Moon cache.
          bash tools/run-java-canonical.sh

      - name: Verify canonical output and evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          FRAMEWORK_JAR: ${{ needs.release-metadata.outputs.framework_jar }}
        run: |
          set -euo pipefail
          execution='bld/evidence/executions/java-canonical/execution.json'
          test -f "bld/artifacts/${APP_JAR}"
          test -f "bld/artifacts/${FRAMEWORK_JAR}"
          test -f bld/evidence/tests/README.md
          test -f bld/evidence/toolchain-build-provenance.txt
          test -f bld/evidence/execution.log
          test -s bld/evidence/executions/java-canonical/execution.log
          test -s "${execution}"
          grep -F '"schema": "brainboxemb.execution-evidence"' "${execution}"
          grep -F '"schema_version": 1' "${execution}"
          grep -F '"capability": "java.canonical"' "${execution}"
          grep -F '"owner": "brainboxemb/tool.java-project"' "${execution}"
          grep -F '"action": "canonical"' "${execution}"
          grep -F '"owner_revision": "d0905548502577ff0a6726eadd73cd214c2bc2c9"' "${execution}"
          grep -F '"tool_java_project_version": "0.1.4"' "${execution}"
          grep -F '"status": "success"' "${execution}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "$(cat bld/source-sha.txt)" = "${SOURCE_REVISION}"
            grep -F '"source_revision": "'"${SOURCE_REVISION}"'"' "${execution}"
          else
            test -f .moon/invocations/framework_java.canonical/materialization.json
            test -f .moon/invocations/framework_java.canonical/moon.log
            grep -F '"source_revision": "'"${SOURCE_REVISION}"'"' .moon/invocations/framework_java.canonical/materialization.json
            grep -F '"status": "success"' .moon/invocations/framework_java.canonical/materialization.json
          fi

      - name: Upload exact canonical Linux app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-timing-framework-canonical
          path: bld/artifacts/${{ needs.release-metadata.outputs.app_jar }}
          if-no-files-found: error
          retention-days: 14

      - name: Stage producer output with current materialization evidence
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/event-timing-framework-publication"
          rm -rf "$staging"
          cp -a bld "$staging"

          if [[ -f .moon/invocations/framework_java.canonical/materialization.json ]]; then
            mkdir -p "$staging/orchestration"
            cp .moon/invocations/framework_java.canonical/moon.log "$staging/orchestration/moon.log"
            cp .moon/invocations/framework_java.canonical/materialization.json "$staging/orchestration/materialization.json"
          fi

      - name: Upload prepared build publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-timing-framework-canonical-publication
          path: ${{ runner.temp }}/event-timing-framework-publication
          if-no-files-found: error
          retention-days: 14

  # This reusable capability performs only the independent Windows Maven build
  # and smoke of the exact Linux-produced application JAR; it never rebuilds Linux.
  windows:
    needs:
      - release-metadata
      - linux-canonical
      - bootstrap-windows
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-windows-compatibility.yml@d0905548502577ff0a6726eadd73cd214c2bc2c9
    with:
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-framework-canonical
      runnable-jar-name: ${{ needs.release-metadata.outputs.app_jar }}
      smoke-expected-output: 'event-timing-app lifecycle OK version=${{ needs.release-metadata.outputs.version }} state=STOPPED'
      test-report-path: '**/target/surefire-reports/**'

  verify-evidence:
    needs:
      - release-metadata
      - linux-canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download prepared publication
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-timing-framework-canonical-publication
          path: publication
      - name: Verify producer and materialization evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          FRAMEWORK_JAR: ${{ needs.release-metadata.outputs.framework_jar }}
        run: |
          set -euo pipefail
          execution='publication/evidence/executions/java-canonical/execution.json'
          test -f "publication/artifacts/${APP_JAR}"
          test -f "publication/artifacts/${FRAMEWORK_JAR}"
          test -f publication/evidence/tests/README.md
          grep -F '# Unit test report' publication/evidence/tests/README.md
          grep -F '**Status: PASS**' publication/evidence/tests/README.md
          test -s publication/evidence/executions/java-canonical/execution.log
          test -s "${execution}"
          grep -F '"schema": "brainboxemb.execution-evidence"' "${execution}"
          grep -F '"owner_revision": "d0905548502577ff0a6726eadd73cd214c2bc2c9"' "${execution}"
          grep -F '"tool_java_project_version": "0.1.4"' "${execution}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "$(cat publication/source-sha.txt)" = "${SOURCE_REVISION}"
            grep -F '"source_revision": "'"${SOURCE_REVISION}"'"' "${execution}"
          else
            test -f publication/orchestration/materialization.json
            grep -F '"source_revision": "'"${SOURCE_REVISION}"'"' publication/orchestration/materialization.json
            grep -F '"status": "success"' publication/orchestration/materialization.json
          fi

  # Generated branch publication is a repository side effect and deliberately
  # remains outside Moon's cacheable task graph.
  publish-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs:
      - windows
      - verify-evidence
    permissions:
      contents: write
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@d0905548502577ff0a6726eadd73cd214c2bc2c9
    with:
      publication-artifact-name: event-timing-framework-canonical-publication

  # Product release semantics remain repository-owned. Main creates the tag only
  # after normal verification/publication; the tag is then verified independently.
  create-release-tag:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - windows
      - verify-evidence
      - publish-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tagged_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "ERROR: ${RELEASE_TAG} already points to ${tagged_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already identifies this verified commit."
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Verify the exact tag in a fresh workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN tag pushes do not recursively start workflows. workflow_dispatch
          # is an explicit exception, so dispatch the same verification workflow at the tag.
          gh workflow run java-verify.yml --ref "${RELEASE_TAG}"
          echo "Dispatched Java verification for ${RELEASE_TAG}."

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - windows
      - verify-evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download canonical release publication
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-timing-framework-canonical-publication
          path: publication
      - name: Verify release artifact identity and prepare assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          FRAMEWORK_JAR: ${{ needs.release-metadata.outputs.framework_jar }}
        run: |
          set -euo pipefail
          test "$(cat publication/source-sha.txt)" = "${GITHUB_SHA}"
          test -f "publication/artifacts/${APP_JAR}"
          test -f "publication/artifacts/${FRAMEWORK_JAR}"

          python3 tools/release_metadata.py verify-artifact \
            --jar "publication/artifacts/${APP_JAR}" \
            --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}"
          python3 tools/release_metadata.py release-notes \
            --version "${RELEASE_VERSION}" \
            --output release-notes.md

          (cd publication/artifacts && sha256sum "${APP_JAR}" "${FRAMEWORK_JAR}") \
            > "SHA256SUMS-${RELEASE_VERSION}.txt"
          tar -czf "event-timing-release-evidence-${RELEASE_VERSION}.tar.gz" \
            -C publication README.md source-sha.txt evidence

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          APP_JAR: ${{ needs.release-metadata.outputs.app_jar }}
          FRAMEWORK_JAR: ${{ needs.release-metadata.outputs.framework_jar }}
        run: |
          set -euo pipefail
          assets=(
            "publication/artifacts/${FRAMEWORK_JAR}"
            "publication/artifacts/${APP_JAR}"
            "SHA256SUMS-${RELEASE_VERSION}.txt"
            "event-timing-release-evidence-${RELEASE_VERSION}.tar.gz"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi

  archive-failed-release:
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !endsWith(github.ref_name, '-failed') &&
      (
        needs.release-metadata.result != 'success' ||
        needs.bootstrap-windows.result != 'success' ||
        needs.linux-canonical.result != 'success' ||
        needs.windows.result != 'success' ||
        needs.verify-evidence.result != 'success' ||
        needs.publish-release.result != 'success'
      )
    needs:
      - release-metadata
      - bootstrap-windows
      - linux-canonical
      - windows
      - verify-evidence
      - publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout failed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Remove any incomplete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
      - name: Preserve candidate as failed tag and remove normal release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/archive_failed_release_tag.py \
            --remote origin \
            --tag "${RELEASE_TAG}" \
            --expected-revision "${GITHUB_SHA}"

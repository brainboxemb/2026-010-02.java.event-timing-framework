name: Java verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: Bootstrap local tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "5db2b23b95ad0a230ab5d5d2bed725927328fcfe"
          test "$(git -C tools/tool.java-project rev-parse HEAD)" = "3cfde795a7575321ea2a8a95e0b7822daaee994f"
      - name: Verify logging dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<artifactId>slf4j-api</artifactId>' framework/pom.xml
          ! grep -F '<artifactId>slf4j-jdk14</artifactId>' framework/pom.xml
          grep -F '<artifactId>slf4j-jdk14</artifactId>' app/pom.xml

  bootstrap-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { git status --short; throw "Checkout is not clean." }
      - name: Bootstrap local tooling
        shell: pwsh
        run: |
          .\bootstrap.ps1
          if ((git -C tools/tool.git-project rev-parse HEAD).Trim() -ne "5db2b23b95ad0a230ab5d5d2bed725927328fcfe") { throw "Unexpected tool.git-project SHA" }
          if ((git -C tools/tool.java-project rev-parse HEAD).Trim() -ne "3cfde795a7575321ea2a8a95e0b7822daaee994f") { throw "Unexpected tool.java-project SHA" }

  java:
    needs:
      - bootstrap-linux
      - bootstrap-windows
    permissions:
      contents: read
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-verify.yml@3cfde795a7575321ea2a8a95e0b7822daaee994f
    with:
      working-directory: .
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: event-timing-framework-canonical
      artifact-path: app/target/event-timing-app-0.1.0-SNAPSHOT.jar
      runnable-jar-name: event-timing-app-0.1.0-SNAPSHOT.jar
      smoke-expected-output: 'event-timing-app lifecycle OK version=0.1.0-SNAPSHOT state=STOPPED'
      test-report-path: '**/target/surefire-reports/**'
      publication-artifact-paths: |
        framework/target/event-timing-framework-0.1.0-SNAPSHOT.jar
        app/target/event-timing-app-0.1.0-SNAPSHOT.jar

  publish-build:
    needs: java
    permissions:
      contents: write
    uses: brainboxemb/tool.java-project/.github/workflows/reusable-java-publish.yml@3cfde795a7575321ea2a8a95e0b7822daaee994f
    with:
      publication-artifact-name: event-timing-framework-canonical-publication

name: Black-box system verification

on:
  pull_request:
    paths:
      - 'system-test/**'
      - '.github/workflows/system-test-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          check-latest: false
          verify-signature: true
          cache: maven

      - name: Run VC-ST1 black-box verification
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify -Psystem-test

      - name: Upload system-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-timing-system-test-pr-evidence
          path: |
            system-test/target/surefire-reports/**
            system-test/target/evidence/**
          if-no-files-found: warn
          retention-days: 14

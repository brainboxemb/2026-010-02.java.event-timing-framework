# Step-4 development configuration: one TimingNode, TimingData storage and presentation interfaces.
timingNodeId: timing-node-01

io:
  storage:
    timingData:
      # Step-4 reference persistence for the configured TimingNode.
      path: data/timing-data.jsonl

presentation:
  remoteShell:
    # Development/service baseline: explicit loopback-only listener.
    bindAddress: 127.0.0.1
    port: 8023
  api:
    http:
      # IF-03 request/response development baseline: loopback-only.
      bindAddress: 127.0.0.1
      port: 8081
    webSocket:
      # IF-03 live event development baseline: separate loopback-only listener.
      bindAddress: 127.0.0.1
      port: 8082

logging:
  # Cross-cutting A08 runtime logging baseline.
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
  live:
    # Engineering/test client connects to this dedicated diagnostics listener.
    bindAddress: 127.0.0.1
    port: 8030

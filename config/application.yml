# Step-3 development configuration: one TimingNode plus presentation interfaces.
timingNodeId: timing-node-01

presentation:
  remoteShell:
    # Development/service baseline: explicit loopback-only listener.
    bindAddress: 127.0.0.1
    port: 8023
  remoteApi:
    http:
      # IF-03 request/response development baseline: loopback-only.
      bindAddress: 127.0.0.1
      port: 8081
    webSocket:
      # IF-03 live event development baseline: separate loopback-only listener.
      bindAddress: 127.0.0.1
      port: 8082

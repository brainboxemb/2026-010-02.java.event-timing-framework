# Step-4 V04 manual Engineering Client demo configuration.
# Uses dedicated TimingData storage so normal development history is untouched.
timingNodeId: timing-node-01

io:
  storage:
    timingData:
      path: data/step4-demo-timing-data.jsonl

presentation:
  remoteShell:
    bindAddress: 127.0.0.1
    port: 8023
  api:
    http:
      bindAddress: 127.0.0.1
      port: 8081
    webSocket:
      bindAddress: 127.0.0.1
      port: 8082

logging:
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
  live:
    bindAddress: 127.0.0.1
    port: 8030
